<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BMI Calculator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h1 {
            color: #d66a00;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 13px 20px;
            border: none;
            border-radius: 7px;
            background: #d66a00;
            color: white;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #fff3e0;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🧮 BMI Calculator</h1>

    <label for="height">
        Height (cm):
    </label>

    <input
        type="number"
        id="height"
        placeholder="Example: 170"
    >


    <label for="weight">
        Weight (kg):
    </label>

    <input
        type="number"
        id="weight"
        placeholder="Example: 65"
    >


    <button onclick="calculateBMI()">
        Calculate BMI
    </button>


    <div id="result">
        Enter height and weight.
    </div>

</div>


<script>

function calculateBMI() {

    const height =
        Number(
            document.getElementById("height").value
        );

    const weight =
        Number(
            document.getElementById("weight").value
        );


    if (
        !height ||
        !weight ||
        height <= 0 ||
        weight <= 0
    ) {

        document.getElementById("result")
            .innerHTML =
            "❌ Please enter valid values.";

        return;
    }


    const heightInMeters =
        height / 100;


    const bmi =
        weight /
        (
            heightInMeters *
            heightInMeters
        );


    document.getElementById("result")
        .innerHTML =
        "BMI: <strong>" +
        bmi.toFixed(2) +
        "</strong>";

}

</script>

</body>

</html>
