<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitBuddy AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8ff;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 25px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #2188e5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2188e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #176bb8;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            min-height: 25px;
        }

        .cards {
            margin-top: 25px;
        }

        .card {
            display: block;
            text-decoration: none;
            padding: 15px;
            margin-top: 12px;
            border-radius: 10px;
            background: #f1f7ff;
            color: #222;
            font-weight: bold;
            text-align: center;
        }

        .card:hover {
            background: #e2efff;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>👤 Create Your Profile</h1>

    <label for="name">Name:</label>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
    >


    <label for="age">Age:</label>

    <input
        type="number"
        id="age"
        value="25"
        min="18"
    >


    <label for="gender">Gender:</label>

    <select id="gender">

        <option value="Male">
            Male
        </option>

        <option value="Female">
            Female
        </option>

        <option value="Other">
            Other
        </option>

    </select>


    <button onclick="saveProfile()">
        Save Profile
    </button>


    <div id="result"></div>


    <div class="cards">

        <a
            class="card"
            href="/workout"
        >
            🏋️ AI Workout Plan
        </a>


        <a
            class="card"
            href="/diet"
        >
            🍲 AI Diet Plan
        </a>


        <a
            class="card"
            href="/bmi"
        >
            🧮 BMI Calculator
        </a>

    </div>

</div>


<script>

async function saveProfile() {

    const result =
        document.getElementById("result");

    const name =
        document.getElementById("name")
        .value
        .trim();

    const age =
        Number(
            document.getElementById("age").value
        );

    const gender =
        document.getElementById("gender").value;


    if (!name) {

        result.innerHTML =
            "❌ Please enter your name.";

        return;
    }


    if (!age || age < 18) {

        result.innerHTML =
            "❌ This FitBuddy demo is intended for adults aged 18 and above.";

        return;
    }


    result.innerHTML =
        "Saving profile...";


    try {

        const response =
            await fetch(
                "/save-profile",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        age: age,

                        gender: gender

                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "Profile response:",
            data
        );


        if (data.success) {

            result.innerHTML =
                "✅ " + data.message;

        } else {

            result.innerHTML =
                "❌ " +
                (
                    data.error ||
                    "Unable to save profile."
                );
        }


    } catch (error) {

        console.error(error);

        result.innerHTML =
            "❌ Unable to connect to the server.";

    }

}

</script>

</body>

</html>
