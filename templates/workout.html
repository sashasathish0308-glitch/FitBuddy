<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Workout Plan Generator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h1 {
            color: #2878c8;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 13px 20px;
            background: #2878c8;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #eef6ff;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🏋️ AI Workout Plan Generator</h1>


    <label for="age">
        Age:
    </label>

    <input
        type="number"
        id="age"
        value="25"
        min="18"
    >


    <label for="level">
        Fitness Level:
    </label>

    <select id="level">

        <option value="Beginner">
            Beginner
        </option>

        <option value="Intermediate">
            Intermediate
        </option>

        <option value="Advanced">
            Advanced
        </option>

    </select>


    <label for="goal">
        Goal:
    </label>

    <select id="goal">

        <option value="General Fitness">
            General Fitness
        </option>

        <option value="Strength">
            Strength
        </option>

        <option value="Endurance">
            Endurance
        </option>

    </select>


    <button onclick="generateWorkout()">
        🤖 Generate AI Workout Plan
    </button>


    <div id="result">
        Enter the details and click the button.
    </div>

</div>


<script>

async function generateWorkout() {

    const result =
        document.getElementById("result");


    const age =
        Number(
            document.getElementById("age").value
        );


    const level =
        document.getElementById("level")
        .value;


    const goal =
        document.getElementById("goal")
        .value;


    if (!age || age < 18) {

        result.innerHTML =
            '<span class="error">' +
            'This demo is intended for adults aged 18 and above.' +
            '</span>';

        return;
    }


    result.innerHTML =
        "🤖 Generating AI workout plan...";


    try {

        const response =
            await fetch(
                "/generate-workout",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        age: age,

                        level: level,

                        goal: goal

                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "Workout response:",
            data
        );


        if (
            data.success === true &&
            data.workout
        ) {

            result.innerHTML =
                "<strong>" +
                "🏋️ AI Generated Workout Plan" +
                "</strong><br><br>" +
                escapeHtml(data.workout);

        } else {

            result.innerHTML =
                '<span class="error">' +
                "❌ Error: " +
                escapeHtml(
                    data.error ||
                    "Unknown error"
                ) +
                "</span>";
        }


    } catch (error) {

        console.error(error);

        result.innerHTML =
            '<span class="error">' +
            "❌ Unable to connect to server." +
            "</span>";

    }

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>

</html>
